[package]
name = "nvme-state-db"
version = "0.1.0"
edition = "2021"
description = "Motor KV de baja latencia para estado blockchain en NVMe"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "nvme_state_db"
path = "src/lib.rs"

[[bin]]
name = "nvme-state-db"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crc32fast = "1"
crossbeam-skiplist = "0.1"
libc = "0.2"
memmap2 = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
